<head>
    <title>MyKash$ | Login</title>
</head>

<body>

    <main>

        <a href="index" class="back-button">

            <span class="material-symbols-outlined">
                arrow_back
            </span>

            Voltar

        </a>

        <section class="formLogin">


            <div class="login-header">

                <div class="login-icon">

                    <span class="material-symbols-outlined">
                        login
                    </span>

                </div>


                <h1>
                    Bem-vindo de volta!
                </h1>


                <p>
                    Entre na sua conta para acompanhar
                    sua vida financeira.
                </p>

            </div>



            <form (ngSubmit)="entrar()">


                <div class="campo">

                    <label for="email">
                        E-mail
                    </label>


                    <div class="input-container">

                        <span class="material-symbols-outlined">
                            mail
                        </span>


                        <input
                            type="email"
                            id="email"
                            name="email"
                            autocomplete="email"
                            placeholder="Digite seu e-mail"
                            required
                        >

                    </div>

                </div>


                <div class="campo">

                    <div class="password-label">

                        <label for="senha">
                            Senha
                        </label>


                        <a href="#">
                            Esqueceu a senha?
                        </a>

                    </div>


                    <div class="input-container">

                        <span class="material-symbols-outlined">
                            lock
                        </span>


                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            autocomplete="current-password"
                            placeholder="Digite sua senha"
                            required
                        >

                    </div>

                </div>

                <p
                    class="login-error"
                    *ngIf="mensagemErro">

                    {{ mensagemErro }}

                </p>


                <button type="submit" class="login-button">

                    Entrar

                    <span class="material-symbols-outlined">
                        arrow_forward
                    </span>

                </button>

            </form>


            <p class="cadastro">

                Ainda não possui uma conta?

                <a routerLink="/cadastro">
                    Cadastre-se
                </a>

            </p>

        </section>

    </main>
    
</body>
